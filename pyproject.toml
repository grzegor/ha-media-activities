[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-media-activities"
version = "0.1.0"
description = "Declarative multimedia activities using existing Home Assistant entities"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "homeassistant==2026.9.4",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
include = ["custom_components.media_activities*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components.media_activities"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
